<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Pexels</title>
	<link rel="stylesheet" href="style.css">
	<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>


<body class="site">
<div class="page">
<section class="header">
	<img class="menu" src="images/menu.svg">
	<div class="header__buttons">
		<button class="header__button">
			<p class="header__button-text">Sign Up</p>
		</button>
		<button class="header__button">
			<p class="header__button-text">Login</p>
		</button>
	</div>
</section>
<main>
	<div class="main__title">
		<div class="main-title">
		<h1 class="main__title-title">Pexels</h1>
		</div>
		<div class="main-subtitle">
		<p class="main__title-subtitle">Best free stock photos in one place.</p>
		</div>
	</div>
	<div class="main__search">
		<div class="main__search-text">
			<p class="main__search-p">Search for free photos...</p>
		</div>
		<div class="main__search-image">
			<img class="main__search-magnifier" src="images/magnifier.svg">
		</div>
	</div>
	<div class="main__words">
		<p class="main__words-word">travel</p>
		<p class="main__words-word">fish</p>
		<p class="main__words-word">shopping</p>
		<p class="main__words-word">house</p>
		<p class="main__words-word">healthy</p>
		<p class="main__words-word">football</p>
		<p class="main__words-word">boat</p>
		<p class="main__words-word">flowers</p>
		<p class="main__words-word">art</p>
	</div>
</main>
<div class="footer">
	<div class="footer__icons">
		<img src="images/facebook.svg">
		<img src="images/twitter.svg">
		<img src="images/instagram.svg">
	</div>
	<div class="footer__text">
		<p class="footer__text-p">Are you a photographer?</p>	
	</div>
</div>
</div>
</body>
</html>
